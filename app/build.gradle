plugins { id 'com.android.application' }
android {
    namespace 'pt.umisushi.browser'
    compileSdk 35
    defaultConfig { applicationId 'pt.umisushi.browser.release'; minSdk 26; targetSdk 35; versionCode 2; versionName '1.3.6' }
    signingConfigs {
        release {
            def signingPath = System.getenv('UMI_SIGNING_KEYSTORE_PATH')
            def signingPassword = System.getenv('UMI_SIGNING_PASSWORD')
            if (signingPath && signingPassword) {
                storeFile file(signingPath)
                storePassword signingPassword
                keyAlias 'umi-browser'
                keyPassword signingPassword
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'com.google.zxing:core:3.5.3' }
